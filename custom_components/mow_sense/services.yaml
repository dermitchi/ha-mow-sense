mow:
  target:
    entity:
      integration: mow_sense
      domain: lawn_mower
  fields:
    hours:
      selector:
        number:
          min: 0.25
          max: 18
          step: 0.25
          unit_of_measurement: h
    ignore_rain:
      default: false
      selector:
        boolean:
park:
  target:
    entity:
      integration: mow_sense
      domain: lawn_mower
  fields:
    until:
      default: further_notice
      selector:
        select:
          translation_key: park_until
          options:
            - further_notice
            - next_schedule
sync_schedule:
  target:
    entity:
      integration: mow_sense
      domain: lawn_mower
read_log:
  target:
    entity:
      integration: mow_sense
      domain: lawn_mower
